name: Build PWA to APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and Build Remix
        run: |
          npm install --legacy-peer-deps
          npm run build
          echo "=== محتويات المشروع بعد البناء ==="
          ls -la
          ls -la build || true
          ls -la build/client || true
          ls -la public || true

      - name: Prepare web assets for Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          rm -rf android
          
          # نحدد اين يوجد index.html
          if [ -f "build/client/index.html" ]; then
            WEB_DIR="build/client"
          elif [ -f "build/index.html" ]; then
            WEB_DIR="build"
          elif [ -f "dist/index.html" ]; then
            WEB_DIR="dist"
          elif [ -f "public/index.html" ]; then
            WEB_DIR="public"
          else
            # اذا لم يوجد index.html ننسخ ملفات build/client الى public وننشئ index.html
            echo "لم يوجد index.html، سنقوم بإنشائه..."
            mkdir -p public
            if [ -d "build/client" ]; then cp -r build/client/* public/ 2>/dev/null || true; fi
            if [ ! -f "public/index.html" ]; then
              echo '<!doctype html><html><head><meta charset="utf-8"><title>Accounting</title></head><body><div id="root"></div><script>window.location.href="/"</script></body></html>' > public/index.html
            fi
            WEB_DIR="public"
          fi
          
          echo "سأستخدم المجلد: $WEB_DIR"
          ls -la $WEB_DIR | head -n 20
          
          echo "{\"appId\":\"com.osama.accounting\",\"appName\":\"Accounting Tasks\",\"webDir\":\"$WEB_DIR\"}" > capacitor.config.json
          cat capacitor.config.json

      - name: Add Android and Copy
        run: |
          npx cap add android
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Accounting-APK-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
