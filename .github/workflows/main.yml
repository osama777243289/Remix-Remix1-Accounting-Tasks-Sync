name: Build Alzain Qaat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore alzain.keystore -alias alzain -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Alzain Qaat, OU=Alzain, O=Alzain, L=Ibb, ST=Ibb, C=YE"

      - name: Build Release APK
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleRelease
          gradle-version: 8.5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alzain-Qaat-APK
          path: app/build/outputs/apk/release/*.apk
