name: Build PWA to APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps and build web
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npm run build || echo "No build script, using public folder"
          ls -la

      - name: Create Capacitor Android project
        run: |
          rm -rf android
          # نحدد مجلد الويب تلقائيا
          WEB_DIR="public"
          if [ -d "build/client" ]; then WEB_DIR="build/client"; fi
          if [ -d "dist" ]; then WEB_DIR="dist"; fi
          echo "Using webDir: $WEB_DIR"
          echo "{\"appId\":\"com.osama.accounting\",\"appName\":\"Accounting Tasks\",\"webDir\":\"$WEB_DIR\"}" > capacitor.config.json
          cat capacitor.config.json
          npx cap add android
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Accounting-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
